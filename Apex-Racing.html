<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX RACING - Drift & Nitro</title>
<style>
  body{margin:0;background:#0a0a0a;color:white;font-family:Arial;overflow:hidden}
  #game{width:100vw;height:100vh;position:relative;background:linear-gradient(#111,#222)}
  canvas{width:100%;height:100%}
  #hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:bold}
  #controls{position:absolute;bottom:10px;width:100%;display:flex;justify-content:space-between;padding:0 20px;box-sizing:border-box}
 .btn{width:80px;height:80px;background:rgba(255,255,255,0.1);border:2px solid #0ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;user-select:none}
  #nitro{background:rgba(255,0,100,0.3);border-color:#f0f}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div>SPEED: <span id="speed">0</span> KM/H</div>
    <div>NITRO: <span id="nitroVal">100</span>%</div>
    <div>LAP: <span id="lap">1/3</span></div>
  </div>
  <canvas id="c"></canvas>
  <div id="controls">
    <div style="display:flex;gap:10px"><div class="btn" id="left">◀</div><div class="btn" id="right">▶</div></div>
    <div style="display:flex;gap:10px"><div class="btn" id="nitro">⚡</div><div class="btn" id="acc">▲</div></div>
  </div>
</div>
<script>
// Simple Drift Racing Logic
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=innerWidth;canvas.height=innerHeight;
let x=canvas.width/2,y=canvas.height-150,angle=0,speed=0,nitro=100,drift=0;
let keys={};
function loop(){
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,canvas.width,canvas.height);
  // road
  ctx.fillStyle='#333';ctx.fillRect(canvas.width/2-150,0,300,canvas.height);
  ctx.strokeStyle='white';ctx.setLineDash([20,20]);ctx.beginPath();ctx.moveTo(canvas.width/2,0);ctx.lineTo(canvas.width/2,canvas.height);ctx.stroke();ctx.setLineDash([]);

  if(keys['ArrowUp']||keys['acc']) speed=Math.min(speed+0.3, nitro>0 && keys['nitro']?12:8);
  else speed=Math.max(speed-0.1,0);
  if(keys['ArrowLeft']||keys['left']) angle-=0.05*speed/5;
  if(keys['ArrowRight']||keys['right']) angle+=0.05*speed/5;

  if((keys['ArrowLeft']||keys['left']||keys['ArrowRight']||keys['right']) && speed>4) drift+=0.5;
  else drift=Math.max(drift-0.5,0);

  if(keys['nitro'] && nitro>0 && speed>2){ nitro-=0.8; speed+=0.5; }

  x+=Math.sin(angle)*speed; y-=Math.cos(angle)*speed;
  // keep in road
  x=Math.max(canvas.width/2-120,Math.min(canvas.width/2+120,x));
  if(y<0) y=canvas.height-150;

  // draw car
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  ctx.shadowBlur=drift;ctx.shadowColor='#0ff';
  ctx.fillStyle=keys['nitro']?'#f0f':'#0ff';ctx.fillRect(-15,-25,30,50);
  ctx.fillStyle='#000';ctx.fillRect(-15,-25,30,10);
  ctx.restore();

  document.getElementById('speed').innerText=Math.floor(speed*20);
  document.getElementById('nitroVal').innerText=Math.floor(nitro);
  document.getElementById('lap').innerText=`DRIFT: ${Math.floor(drift)}`;

  requestAnimationFrame(loop);
}
loop();
function bind(id,key){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true});
  el.addEventListener('touchend',e=>{e.preventDefault();keys[key]=false});
  el.addEventListener('mousedown',()=>keys[key]=true);
  el.addEventListener('mouseup',()=>keys[key]=false);
}
bind('left','left');bind('right','right');bind('acc','acc');bind('nitro','nitro');
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
window.addEventListener('resize',()=>{canvas.width=innerWidth;canvas.height=innerHeight});
</script>
</body>
</html>
