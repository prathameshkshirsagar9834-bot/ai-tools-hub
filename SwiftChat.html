<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SwiftChat</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;display:flex;height:100vh}
#side{width:35%;background:#1a1a1a;border-right:1px solid #333}
#top{padding:15px;background:#222;display:flex;gap:10px;align-items:center}
#logo{width:35px;height:35px;background:#0ff;color:#000;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:900}
#list.c{padding:12px;border-bottom:1px solid #222;display:flex;gap:10px;cursor:pointer}
#list.c:hover{background:#222}
#main{flex:1;display:flex;flex-direction:column;background:#0a0a0a}
#mTop{padding:12px;background:#222;display:flex;gap:10px;align-items:center}
#msgs{flex:1;padding:15px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.me{align-self:flex-end;background:#00a884;padding:8px 12px;border-radius:12px;max-width:70%}
.you{align-self:flex-start;background:#333;padding:8px 12px;border-radius:12px;max-width:70%}
#bar{padding:10px;background:#222;display:flex;gap:8px}
#bar input{flex:1;padding:12px;border-radius:20px;border:none;background:#333;color:#fff;outline:none}
#bar button{background:#00f5ff;border:none;width:45px;height:45px;border-radius:50%}
</style>
</head>
<body>
<div id="side">
<div id="top"><div id="logo">S</div><b>SwiftChat</b></div>
<div id="list"></div>
</div>
<div id="main">
<div id="mTop"><b id="mName">SwiftChat Team</b></div>
<div id="msgs"></div>
<div id="bar"><input id="inp" placeholder="Message..."><button id="send">></button></div>
</div>
<script>
let contacts=['SwiftChat Team','Mummy','Gaming Squad','Papa'];
let cur=0;
let chats=[['Welcome to SwiftChat 🚀'],['Haan beta?'],['Apex khelega?'],['Paisa bheja']];
function render(){
let l=document.getElementById('list');l.innerHTML='';
contacts.forEach((n,i)=>{l.innerHTML+=`<div class="c" onclick="openC(${i})">${n}</div>`});
let m=document.getElementById('msgs');m.innerHTML='';
chats[cur].forEach(t=>{m.innerHTML+=`<div class="${t.includes('You:')?'me':'you'}">${t}</div>`});
}
function openC(i){cur=i;document.getElementById('mName').innerText=contacts[i];render();}
document.getElementById('send').onclick=()=>{
let v=document.getElementById('inp').value;if(!v)return;
chats[cur].push('You: '+v);document.getElementById('inp').value='';render();
setTimeout(()=>{chats[cur].push('Ok 👍');render();},800);
};
render();
</script>
</body>
</html>
