<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SwiftChat</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}
body{background:#0f0f0f;height:100vh;display:flex}
#side{width:32%;background:#161616;border-right:1px solid #2a2a2a;color:#fff;display:flex;flex-direction:column}
#top{background:#1f1f1f;padding:16px;display:flex;gap:10px;align-items:center}
#logo{width:38px;height:38px;background:linear-gradient(135deg,#00f5ff,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
#search{margin:12px;background:#1f1f1f;padding:10px 14px;border-radius:12px;display:flex;gap:10px}
#search input{background:transparent;border:none;color:#fff;width:100%;outline:none}
.chat{padding:14px;display:flex;gap:12px;cursor:pointer;border-radius:12px;margin:2px 8px}
.chat.active,.chat:hover{background:#1f1f1f}
.chat img{width:48px;height:48px;border-radius:12px}
#main{flex:1;background:#0a0a0a;display:flex;flex-direction:column}
#mTop{background:#161616;padding:14px;color:#fff;display:flex;gap:12px;align-items:center;border-bottom:1px solid #2a2a2a}
#msgs{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0a 70%)}
.bubble{max-width:62%;padding:10px 14px;border-radius:18px;font-size:14.5px}
.me{align-self:flex-end;background:linear-gradient(135deg,#00f5ff,#7c3aed);color:#fff;border-bottom-right-radius:4px}
.you{align-self:flex-start;background:#1f1f1f;color:#e5e5e5;border:1px solid #2a2a2a;border-bottom-left-radius:4px}
#inputBar{background:#161616;padding:12px;display:flex;gap:12px;align-items:center}
#inputBar input{flex:1;background:#0f0f0f;border:1px solid #2a2a2a;padding:13px 18px;border-radius:25px;color:#fff;outline:none}
#send{background:linear-gradient(135deg,#00f5ff,#7c3aed);border:none;width:46px;height:46px
